# S3 / MinIO storage test environment
#
# Runs MinIO (S3-compatible) alongside Masa CMS behind an Nginx reverse proxy.
# The filestorage_s3 module is mounted into Masa's global modules directory,
# making it available to all sites. The module's standardUserAssetActionHandler
# overrides the default, routing User_Assets I/O through s3StorageService -> MinIO.
#
# Usage:
#   docker compose up
#
# Masa CMS: http://localhost:18182  (via Nginx)
# MinIO Console: http://localhost:9001  (user: minioadmin / minioadmin)

services:

  masa_mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: masadb
    networks:
      - masa-test
    volumes:
      - masa_mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3-compatible object storage for local testing
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - masa-test
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization - idempotent, safe on restarts
  minio_init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - masa-test
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/masacms-assets;
        mc anonymous set public local/masacms-assets;
        echo 'MinIO bucket ready.';
      "

  masa_storage_s3_lucee:
    image: lucee/lucee:latest
    env_file: ../../lucee/.env
    environment:
      MURA_DBTYPE: mysql
      MURA_DBCONNECTIONSTRING: "jdbc:mysql://masa_mariadb:3306/masadb?useUnicode=true&characterEncoding=UTF-8&useLegacyDatetimeCode=true"
      MURA_DBCLASS: com.mysql.jdbc.Driver
      MURA_DBUSERNAME: root
      MURA_DBPASSWORD: rootpassword
      MURA_DBHOST: masa_mariadb
      MURA_DBPORT: 3307
      MURA_PORT: 18182
      MURA_INDEXFILEINURLS: false
      # S3 storage configuration
      MURA_FILESTORE: S3
      MURA_FILESTOREENDPOINT: http://minio:9000
      MURA_FILESTOREACCESSINFO: minioadmin^minioadmin^masacms-assets
    depends_on:
      minio:
        condition: service_healthy
      masa_mariadb:
        condition: service_healthy
    networks:
      - masa-test
    volumes:
      - ../../../masacms:/var/www
      - ../../lucee/common/password.txt:/opt/lucee/server/lucee-server/context/password.txt
      # Mount the S3 module into the global modules directory so all sites pick it up.
      - ../modules/filestorage_s3:/var/www/modules/filestorage_s3

  # Nginx: handles asset proxying to MinIO and URL rewriting for Masa CMS
  nginx:
    image: nginx:alpine
    ports:
      - "18182:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - masa_storage_s3_lucee
    networks:
      - masa-test

volumes:
  minio_data:
  masa_mariadb_data:

networks:
  masa-test:
    name: masa-test-s3
    external: false
