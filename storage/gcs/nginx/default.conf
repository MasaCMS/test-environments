server {
    listen 80;

    # Docker's internal DNS — required for dynamic proxy_pass with captured variables
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;
    # GCS assets/cache — served directly from fake-gcs, bypassing Lucee entirely.
    # Object key in GCS is {siteid}/{subtype}/{filename}, which maps cleanly to the
    # download path since fake-gcs uses a greedy {objectName:.+} route that accepts
    # unencoded slashes in the path.
    # Falls back to Lucee if the object isn't found in GCS (e.g. during uploads).
    location ~* ^/sites/([^/]+)/(assets|cache)/(.+)$ {
        set $gcs_url http://fake_gcs:4443/download/storage/v1/b/masacms-assets/o/$1/$2/$3?alt=media;
        proxy_pass              $gcs_url;
        proxy_set_header        Host fake_gcs;
        add_header              Cache-Control "public, max-age=86400";
        proxy_intercept_errors  on;
        error_page 404 =        @lucee;
    }

    # Requests already routed through index.cfm — proxy directly to Lucee
    location ^~ /index.cfm {
        proxy_pass         http://masa_storage_gcs_lucee:8888;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # Server-side directories containing real files — proxy directly without rewrite
    # (mirrors htaccess !-d condition)
    location ~* ^/(admin|core|modules|plugins|themes|tasks)/ {
        proxy_pass         http://masa_storage_gcs_lucee:8888;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # Static files and CFML scripts — proxy directly without rewrite.
    # Mirrors htaccess !-f condition: these paths resolve to real files on the server.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf|swf|pdf|map|txt|xml|json|cfm|cfc|cfml)$ {
        proxy_pass         http://masa_storage_gcs_lucee:8888;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # CMS page URLs (no file extension) — rewrite to /index.cfm/$1 then proxy to Lucee.
    # Mirrors htaccess: RewriteCond !-f !-d / RewriteRule ^(.*) /index.cfm/$1
    location / {
        rewrite ^/(.*)$ /index.cfm/$1 break;
        proxy_pass         http://masa_storage_gcs_lucee:8888;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # Named fallback: asset not yet in GCS (e.g. mid-upload) — route through Lucee proxy
    location @lucee {
        rewrite ^/(.*)$ /index.cfm/$1 break;
        proxy_pass         http://masa_storage_gcs_lucee:8888;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }
}
